version: '3.8'

services:
  backend:
    build: .
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - USERS_TABLE=Users
      - ORDERS_TABLE=Orders
      - ORDERS_PHONE_INDEX=PhoneIndex
      - FORUM_TABLE=Forum
      - NOTIFICATIONS_TABLE=Notifications
    depends_on:
      - redis
      - dynamodb-local

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  dynamodb-local:
    image: amazon/dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb"